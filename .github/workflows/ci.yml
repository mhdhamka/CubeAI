name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        node-version: ["22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. Python Environment Setup ---
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Removed automatic caching since there's no requirements.txt yet

      - name: Install Python dependencies / libraries
        run: |
          python -m pip install --upgrade pip
          # Install common dependencies if needed later, e.g.:
          # pip install opencv-python numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- 2. Node.js Environment Setup ---
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # --- 3. Linting & Testing ---
      - name: Run Python Syntax/Import Checks
        run: |
          # Verify that python modules compile without syntax errors
          python -m compileall ai/

      - name: Build TypeScript / Web Application
        run: npm run build