services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: cube-ai-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cubeai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: ${DB_NAME:-cube_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cubeai} -d ${DB_NAME:-cube_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cube-ai-network
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cube-ai-api
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-CubeAI API}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      HOST: ${API_HOST:-0.0.0.0}
      PORT: ${API_PORT:-8000}
      DATABASE_URL: postgresql://${DB_USER:-cubeai}:${DB_PASSWORD:-changeme123}@postgres:5432/${DB_NAME:-cube_ai_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cube-ai-network
    restart: unless-stopped

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: cube-ai-web
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./:/app
      - /app/.next
      - /app/node_modules
      - /app/apps/web/node_modules
    command: ["npm", "run", "web:dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cube-ai-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  cube-ai-network:
    driver: bridge